spring.application.name=project_biglietteria
server.port=8080

# ---- DATASOURCE, dove si trovano i miei dati ----
spring.datasource.url=jdbc:mysql://localhost:3306/biglietteria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sessionVariables=sql_mode=''
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA/HIBERNATE
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.database-platform=org.hibernate.h2dialect



